# 一键拉起依赖中间件：MySQL(3307，避开本机默认3306) + Redis(6379)
# 用法：docker compose up -d
# 说明：MySQL 8.4+ 已移除 --default-authentication-plugin 参数，此处仅设置字符集
services:
  mysql:
    image: mysql:8
    container_name: aiwear-mysql
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bite_wear
      MYSQL_USER: bite
      MYSQL_PASSWORD: bite@123
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-character-set=utf8mb4

  redis:
    image: redis:7-alpine
    container_name: aiwear-redis
    ports: ["6379:6379"]
